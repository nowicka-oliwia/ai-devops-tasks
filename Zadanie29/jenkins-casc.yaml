
# Jenkins Configuration as Code (JCasC)

jenkins:
  systemMessage: "Jenkins skonfigurowany automatycznie przez JCasC"
  numExecutors: 2
  mode: NORMAL

  # Timeout bezczynności sesji
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true

  remotingSecurity:
    enabled: true

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:

  # Globalne narzędzia
  location:
    url: "http://localhost:8080/"

tool:
  maven:
    installations:
      - name: "Maven-3"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"

  nodejs:
    installations:
      - name: "NodeJS-20"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.18.0"
                    npmPackagesRefreshHours: 72

  dockerTool:
    installations:
      - name: "Docker"
        properties: []

# Konfiguracja przykładowego zadania pipeline
jobs:
  - script: >
      pipelineJob('example-nodejs-pipeline') {
        description('Przykładowy pipeline Node.js skonfigurowany przez JCasC')

        definition {
          cps {
            script("""
              pipeline {
                agent any

                tools {
                  nodejs 'NodeJS-20'
                }

                stages {
                  stage('Checkout') {
                    steps {
                      checkout scm
                    }
                  }

                  stage('Install') {
                    steps {
                      sh 'npm install'
                    }
                  }

                  stage('Test') {
                    steps {
                      sh 'npm test'
                    }
                  }

                  stage('Build') {
                    steps {
                      sh 'npm run build'
                    }
                  }
                }

                post {
                  success {
                    echo 'Pipeline zakończony sukcesem!'
                  }

                  failure {
                    echo 'Pipeline zakończony błędem!'
                  }
                }
              }
            """.stripIndent())

            sandbox()
          }
        }
      }
